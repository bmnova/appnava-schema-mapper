[project]
name = "schema-mapper"
version = "0.1.0"
description = "LLM-proposed, deterministically-executed mapping of Firebase events to AppNava's standard schema"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "google-cloud-bigquery>=3.25",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
schema-mapper = "schema_mapper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
