# Ground truth for the Flood-It! mapping.
# Provenance: session_start and level_start labeled by the author; the rest
# drafted by an independent Claude subagent that saw only the target schema
# and the facts below (not the agent's output), then reviewed by the author.
# Items marked 'debatable' are product decisions.
# Fill in `expected` for each event (replace TODO):
#   expected: level_start                        # one target
#   expected: null                               # should stay unmapped
#   expected: [game_mode_select, feature_tap]    # split into several targets
# Targets must be names from schemas/target_schema.yaml.
# `facts` are from the profile to help you decide; they are not the answer.

events:
  session_start:
    expected: session_start
    facts: "Firebase auto event; no custom params."
  level_start:
    expected: level_start
    facts: "Params: level, level_name (level_0..)."
  level_start_quickplay:
    expected: level_start
    facts: "Params: board (S/M/L). Quickplay mode."
  level_complete:
    expected: level_complete
    facts: "Params: level, level_name, value."
  level_fail_quickplay:
    expected: level_fail
    facts: "Params: board (S/M/L)."
  level_end:
    expected: null  # debatable
    facts: "Params: level, level_name only. No success/fail param. level_complete and level_fail also exist."
  level_end_quickplay:
    expected: null  # debatable
    facts: "Params: board only. level_complete_quickplay and level_fail_quickplay also exist."
  level_reset:
    expected: level_retry  # debatable
    facts: "Params: level, level_name. level_retry also exists as its own event."
  level_up:
    expected: null  # debatable
    facts: "Params: level, level_name, value."
  post_score:
    expected: null  # debatable
    facts: "Params: level, level_name, score, time."
  select_content:
    expected: [game_mode_select, feature_tap]  # debatable
    facts: "content_type values: mode, level, board, IAP; plus item_id."
  ad_reward:
    expected: ad_reward_claim
    facts: "Params: ad_event_id, ad_unit_code, type (Steps), value."
  in_app_purchase:
    expected: purchase
    facts: "Params: product_id (remove_ads), price, currency, value (micros)."
  challenge_a_friend:
    expected: social_share
    facts: "Params: board."
  screen_view:
    expected: null
    facts: "Firebase auto event; firebase_screen params only."
